# Lint et build à chaque PR vers main (story 1.3, AD-23).
# Aucun secret : le build réussit sans DATABASE_URL (erreurs DatabaseNotReachable attendues).
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    name: Lint et build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json # engines.node (24.x)
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npm run build
